name: Build macOS Test

on:
  push:
    tags:
      - 'macos-test-v*'
  workflow_dispatch:

jobs:
  build-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Build macOS app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mouzi ${{ github.ref_name }} (macOS test)'
          releaseBody: |
            Unofficial macOS test build for the current Mouzi release.
            Not signed or notarized — right-click the app and choose "Open" on first launch.

            This is a draft/prerelease intended for testing only.
          releaseDraft: true
          prerelease: true
          args: '--target aarch64-apple-darwin'
